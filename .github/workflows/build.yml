      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Show error in summary
        if: failure()
        run: |
          echo '## Build failed — last lines of the log' >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -nE "error|FAILURE|What went wrong|Exception|Could not" build.log | head -40 >> $GITHUB_STEP_SUMMARY || true
          echo '---' >> $GITHUB_STEP_SUMMARY
          tail -60 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk mukarrir.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3
          name: "تكرار النية v3"
          body: "النسخة الثالثة: أكثر من جملة مع بعض، الألوان، عدد الأيام لكل جملة وإشعار عند الاكتمال."
          files: mukarrir.apk
