      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build release APK
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publish build log on failure
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log
          name: "سجل البناء (للتشخيص)"
          body: "آخر سجل بناء فاشل. يتبدّل تلقائياً مع كل محاولة."
          files: build.log
          prerelease: true

      - name: Collect APK
        run: cp app/build/outputs/apk/release/app-release.apk mukarrir.apk

      - name: Publish to Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3
          name: "تكرار النية v3"
          body: "النسخة الثالثة: أكثر من جملة مع بعض، الألوان، عدد الأيام لكل جملة وإشعار عند الاكتمال."
          files: mukarrir.apk
